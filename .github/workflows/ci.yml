name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Scans this repository with the scanner code from the commit under test, so a
  # change to the scanner is exercised before it reaches main.
  security-scan:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      pipeline-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      fail-on: high
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
